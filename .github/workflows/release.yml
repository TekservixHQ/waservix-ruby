name: release
on:
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: rubygems/configure-rubygems-credentials@v1.0.0
      - run: gem build *.gemspec
      - run: gem push *.gem
